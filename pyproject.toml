[project]
name = "ragwriter"
version = "0.1.0"
description = "基于 RAG 的品牌内容写作系统（万悉笔试题二）"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",        # 文字层抽取 + 逐页渲染（AGPL，见 README 许可说明）
    "jieba>=0.42",          # 中文分词，供 BM25
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx[socks]>=0.27",   # LLM 适配层，不绑任何厂商 SDK；socks 版便于评审人走代理
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 稠密检索。模型约 2GB，无网络或不想下载时可跳过，系统自动退到 BM25 单路
dense = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# 盲区探测：用本机 OCR 量化「图里有、文字层没有」的内容。macOS 专用，可选。
# 没装就跳过探测，并在语料报告里写明「本轮未做盲区探测」
ocr = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ragwriter = "ragwriter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragwriter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: 真链路测试，需 RAG_E2E=1 与可用的模型配置"]
